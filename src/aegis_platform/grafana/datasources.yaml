{
  "apiVersion": 1,
  "datasources": [
    {
      "name": "Aegis Prometheus",
      "uid": "aegis-prometheus",
      "type": "prometheus",
      "access": "proxy",
      "url": "http://prometheus.aegis-observability.svc.cluster.local:8080",
      "basicAuth": true,
      "basicAuthUser": "query",
      "secureJsonData": {
        "basicAuthPassword": "$AEGIS_QUERY_PASSWORD"
      },
      "editable": false,
      "isDefault": true,
      "jsonData": {
        "httpMethod": "GET",
        "timeInterval": "15s"
      }
    },
    {
      "name": "Aegis Loki",
      "uid": "aegis-loki",
      "type": "loki",
      "access": "proxy",
      "url": "http://loki.aegis-observability.svc.cluster.local:8080",
      "basicAuth": true,
      "basicAuthUser": "query",
      "secureJsonData": {
        "basicAuthPassword": "$AEGIS_QUERY_PASSWORD"
      },
      "editable": false,
      "isDefault": false,
      "jsonData": {
        "maxLines": 200,
        "derivedFields": [
          {
            "name": "TraceID",
            "matcherRegex": "\"trace_id\"\\s*:\\s*\"([a-f0-9]{32})\"",
            "datasourceUid": "aegis-tempo",
            "url": "$${__value.raw}"
          }
        ]
      }
    },
    {
      "name": "Aegis Tempo",
      "uid": "aegis-tempo",
      "type": "tempo",
      "access": "proxy",
      "url": "http://tempo.aegis-observability.svc.cluster.local:8080",
      "basicAuth": true,
      "basicAuthUser": "query",
      "secureJsonData": {
        "basicAuthPassword": "$AEGIS_QUERY_PASSWORD"
      },
      "editable": false,
      "isDefault": false,
      "jsonData": {
        "tracesToLogsV2": {
          "datasourceUid": "aegis-loki",
          "spanStartTimeShift": "-1m",
          "spanEndTimeShift": "1m",
          "tags": [
            {
              "key": "k8s.namespace.name",
              "value": "k8s_namespace_name"
            },
            {
              "key": "aegis.cluster.uid",
              "value": "aegis_cluster_uid"
            }
          ],
          "filterByTraceID": false,
          "filterBySpanID": false,
          "customQuery": true,
          "query": "{$${__tags}} |= \"$${__trace.traceId}\""
        }
      }
    }
  ]
}
